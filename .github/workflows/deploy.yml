name: CI + Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint + typecheck + tests + build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Data spine (PLAN P1.15, ADR-0003). None of these reaches the live Supabase project or needs
      # a credential: db:check reads the SQL text; db:gate applies the archive to a throwaway PGlite
      # database (real Postgres in wasm) and proves RLS/isolation; seed:check regenerates the seed
      # SQL from src/content/seed and diffs it. Order from the Themis BRAIN: check → gate → prove-red.
      - run: npm run db:check
      - name: Migration gate (npm run db:gate)
        run: npm run db:gate
        timeout-minutes: 5
      # A gate nobody has seen fail is not a gate: prove-red sabotages a COPY of the archive 25 ways
      # and asserts the gate goes RED on the expected line each time; the control run must stay GREEN.
      - name: Prove the gate red (npm run db:gate:prove-red)
        run: npm run db:gate:prove-red
        env:
          PROVE_RED_JOBS: '4'
        timeout-minutes: 10
      - run: npm run seed:check
      # TWO BUILDS, ON PURPOSE (PLAN P6.4; DECISIONS.md 2026-10-06). The browser-driven gates below
      # (e2e, Lighthouse) must never reach the live backend from a CI runner, so they test a
      # LOCAL-ONLY build: the Supabase names are blanked explicitly (src/lib/env.ts then selects
      # local-only mode, and nothing is sent anywhere). The artifact that Pages serves is built a
      # second time at the end of the job, in CONFIGURED mode from the repository variables, and is
      # itself bundle-scanned and PWA-checked before upload. Same source, same commit; the only
      # difference between the two dist/ is the inlined env.
      - name: Build, local-only mode (test build)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
          VITE_FLEET_URL: ''
          VITE_FLEET_KEY: ''
          VITE_FLEET_PRODUCT_ID: ''
      # Bundle secret scan (PLAN P6.2, CLAUDE.md §3 #1): every text file in dist/ is public. Fails on a
      # secret-looking value (sk-ant-, sbp_, a service_role JWT, a PEM private key, …), the literal
      # `service_role` or a server-only env NAME. The anon key is public by design and not a finding.
      - run: npm run check:bundle
      # Installability gate: manifest fields, every icon the manifest names, the service worker.
      - run: npm run check:pwa
      # THE DEAD-BACKEND TEST BUILD (PLAN P5.1): the same source built a second time into dist-dead/,
      # CONFIGURED against an address nothing listens on (VITE_SUPABASE_URL=http://127.0.0.1:9/, a
      # dummy anon key — scripts/build-dead.mjs sets both itself; no variable, no secret). The e2e
      # `dead-backend` project serves it on 4174 and proves every page's error state and Retry on
      # the production artifact against a backend that really fails. dist/ is untouched.
      - name: Build, dead-backend mode (test build)
        run: npm run build:dead
      # e2e (PLAN P3.6 + P5.1): Playwright, TWO projects. `local` runs against the local-only dist/
      # just built and PWA-checked; `dead-backend` against dist-dead/ (above). Both are served with
      # GitHub Pages semantics at /hygieia/ (e2e/support/pages-server.mjs --base /hygieia: a file,
      # else 404.html with status 404), so the SPA fallback is really exercised. E2E_PREBUILT=1 tests
      # both directories as they are, with no rebuild. No backend and no secret: one build has no
      # Supabase env (local-only mode), the other points at a dead loopback port. The FULL Chromium is installed (which brings the
      # headless shell the e2e suite drives along with it), cached per Playwright version; system deps
      # come from apt. Full, not `--only-shell`: the Lighthouse gate below drives Chrome through
      # chrome-launcher, and on ubuntu-latest the headless shell never exposed its DevTools port.
      - name: Playwright version (browser cache key)
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-full
      - name: Install chromium (full build + headless shell + system deps)
        run: npx playwright install --with-deps chromium
      - name: e2e against the production builds, local + dead-backend (npm run e2e)
        run: npm run e2e
        env:
          E2E_PREBUILT: '1'
        timeout-minutes: 5
      - name: Upload e2e failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
      # Lighthouse mobile gate (PLAN P5.3, §1 item 10): performance, accessibility and best-practices
      # >= 90 on every route in e2e/support/routes.ts, against the same local-only dist/ (no
      # rebuild), served with Pages semantics and gzip like Pages. Local-only also keeps the
      # performance score free of live-backend latency. CI applies a documented −5 tolerance on PERFORMANCE
      # only (scripts/check-lighthouse.mjs header: shared runners vary). Drives the full Chromium
      # installed above with `--no-sandbox --disable-dev-shm-usage` (the script adds them when CI is
      # set; its header says why) and prints the resolved binary + flags first, with the tail of
      # chrome-err.log on a launch failure. The HTML + JSON reports are uploaded always, so a
      # near-miss can be read without re-running the job.
      - name: Lighthouse mobile gate (npm run check:lighthouse)
        run: npm run check:lighthouse
        timeout-minutes: 8
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          if-no-files-found: ignore
          retention-days: 14
      # THE PAGES ARTIFACT: the same source built again in CONFIGURED mode (PLAN P6.4). The five
      # names come from repository VARIABLES (Settings → Secrets and variables → Actions → Variables;
      # OPERATOR-P2 OP2.c sets the Supabase pair, OPERATOR-P6 OP6.a the fleet trio), NOT from
      # secrets: every value is public by design (Vite inlines them into the public bundle; the anon
      # key is RLS-bound, the fleet key is write-only), and a secret would only make the value
      # invisible in these logs while it sits in plain text in dist/. Until the operator sets them,
      # and on pull requests from forks (which see no variables), the expressions resolve to empty
      # strings and the artifact is local-only — the correct behaviour, not a failure. Vite empties
      # dist/ first, so no file of the test build survives into the artifact.
      - name: Build, configured mode (Pages artifact)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FLEET_URL: ${{ vars.VITE_FLEET_URL }}
          VITE_FLEET_KEY: ${{ vars.VITE_FLEET_KEY }}
          VITE_FLEET_PRODUCT_ID: ${{ vars.VITE_FLEET_PRODUCT_ID }}
      # The scans again, on the artifact that actually ships: the anon key and the fleet key must NOT
      # be findings (check-bundle-secrets.mjs flags secret-looking prefixes, a service_role JWT and
      # server-only names; a publishable key is none of those), and a service-role key pasted into
      # the wrong variable fails the job here, before anything is uploaded.
      - name: Bundle secret scan of the Pages artifact (npm run check:bundle)
        run: npm run check:bundle
      - name: Installability check of the Pages artifact (npm run check:pwa)
        run: npm run check:pwa
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # Only main deploys; a PR proves the build and stops there.
  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
