name: CI + Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint + typecheck + tests + build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Data spine (PLAN P1.15, ADR-0003). None of these reaches the live Supabase project or needs
      # a credential: db:check reads the SQL text; db:gate applies the archive to a throwaway PGlite
      # database (real Postgres in wasm) and proves RLS/isolation; seed:check regenerates the seed
      # SQL from src/content/seed and diffs it. Order from the Themis BRAIN: check → gate → prove-red.
      - run: npm run db:check
      - name: Migration gate (npm run db:gate)
        run: npm run db:gate
        timeout-minutes: 5
      # A gate nobody has seen fail is not a gate: prove-red sabotages a COPY of the archive 25 ways
      # and asserts the gate goes RED on the expected line each time; the control run must stay GREEN.
      - name: Prove the gate red (npm run db:gate:prove-red)
        run: npm run db:gate:prove-red
        env:
          PROVE_RED_JOBS: '4'
        timeout-minutes: 10
      - run: npm run seed:check
      # No Supabase env in CI: the build runs in local-only mode (src/lib/env.ts), so the
      # artifact below carries no backend configuration and no secret.
      - run: npm run build
      # Bundle secret scan (PLAN P6.2, CLAUDE.md §3 #1): every text file in dist/ is public. Fails on a
      # secret-looking value (sk-ant-, sbp_, a service_role JWT, a PEM private key, …), the literal
      # `service_role` or a server-only env NAME. The anon key is public by design and not a finding.
      - run: npm run check:bundle
      # Installability gate: manifest fields, every icon the manifest names, the service worker.
      - run: npm run check:pwa
      # e2e (PLAN P3.6): Playwright against the dist/ just built and PWA-checked, served with GitHub
      # Pages semantics at /hygieia/ (e2e/support/pages-server.mjs --base /hygieia: a file, else
      # 404.html with status 404), so the SPA fallback is really exercised. E2E_PREBUILT=1 tests THIS
      # artifact, the one uploaded below, with no second build. No backend and no secret: the build
      # has no Supabase env (local-only mode). Only the headless shell is installed, cached per
      # Playwright version; system deps come from apt.
      - name: Playwright version (browser cache key)
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - name: Install chromium (headless shell + system deps)
        run: npx playwright install --with-deps --only-shell chromium
      - name: e2e against the production build (npm run e2e)
        run: npm run e2e
        env:
          E2E_PREBUILT: '1'
        timeout-minutes: 5
      - name: Upload e2e failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
      # Lighthouse mobile gate (PLAN P5.3, §1 item 10): performance, accessibility and best-practices
      # >= 90 on every route in e2e/support/routes.ts, against the same dist/ (no rebuild), served
      # with Pages semantics and gzip like Pages. CI applies a documented −5 tolerance on PERFORMANCE
      # only (scripts/check-lighthouse.mjs header: shared runners vary). Drives the headless shell
      # installed above. The HTML + JSON reports are uploaded always, so a near-miss can be read
      # without re-running the job.
      - name: Lighthouse mobile gate (npm run check:lighthouse)
        run: npm run check:lighthouse
        timeout-minutes: 8
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # Only main deploys; a PR proves the build and stops there.
  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
